[package]
name = "tray-idle-inhibitor"
version = "0.1.0"
edition = "2021"
description = "Tray applet: manual and automatic (MPRIS) idle inhibitor for labwc/wlroots"
license = "MIT"
repository = "https://github.com/JageloR/tray-idle-inhibitor"
keywords = ["idle", "inhibitor", "tray", "wayland", "lxqt"]
categories = ["gui"]
rust-version = "1.87"

[dependencies]
ksni = "0.3"
wayland-client = "0.31"
wayland-protocols = { version = "0.31", features = ["client", "unstable"] }
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "process"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
