# tray-idle-inhibitor — пример конфигурации.
#
# Системный файл `/etc/xdg/tray-idle-inhibitor/config.toml` действует для всех
# пользователей. Свои настройки кладите в
# `~/.config/tray-idle-inhibitor/config.toml`: там достаточно указать только те
# ключи, которые хотите изменить, остальные возьмутся из системного файла или
# из значений по умолчанию.
#
# Конфиг читается один раз при запуске. После правки перезапустите программу.
# Флаги командной строки (--auto, --start-on, -i) сильнее конфига.

# Включать инхибитор при воспроизведении медиа (MPRIS через playerctl).
# Эквивалент запуска с --auto.
auto = false

# Держать инхибитор с самого запуска (чашка вместо луны).
start_on = false

# Как часто проверять медиа и перечитывать цвет панели, секунды (>= 1).
interval_secs = 5

[color]
# theme — цвет шрифта активной темы панели (по умолчанию),
#         иначе чёрный/белый по контрасту с фоном панели;
# auto  — всегда чёрный/белый по контрасту с фоном панели, тема не читается;
# fixed — всегда color.fg.
mode = "theme"

# Тема LXQt, из которой брать цвет, вместо активной из ~/.config/lxqt/lxqt.conf.
# Позволяет не зависеть от темы панели и lxqt-panel. Пусто — активная тема.
theme = ""

# Цвет иконки для mode = "fixed", формат #rrggbb.
fg = "#ffffff"
